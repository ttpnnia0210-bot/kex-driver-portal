<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEX Driver Job & Rate Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-orange-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center overflow-hidden p-1">
                    <img src="logo.jpg" alt="KEX Logo" class="w-full h-full object-contain" onerror="this.onerror=null; this.src='https://placehold.co/100x100?text=KEX';">
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight">KEX JOB & RATE PORTAL</h1>
                    <p class="text-xs text-orange-100">ระบบจองรอบวิ่งและตรวจสอบเรทราคา KEX</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <div class="max-w-2xl mx-auto">
                <div class="text-center mb-6">
                    <h2 class="text-xl font-bold text-gray-800">ลงทะเบียนจองรอบวิ่ง / ฝากประวัติสมัครงาน</h2>
                    <p class="text-sm text-gray-500 mt-1">กรอกข้อมูลให้ครบถ้วนเพื่อให้เจ้าหน้าที่ติดต่อกลับ</p>
                </div>

                <form id="driverForm" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ - นามสกุล *</label>
                            <input type="text" name="name" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทรศัพท์ *</label>
                            <input type="tel" name="phone" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ประเภทรถ *</label>
                            <select name="carType" required class="w-full px-4 py-2 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-orange-500 focus:outline-none">
                                <option value="">-- กรุณาเลือกประเภทรถ --</option>
                                <option value="4W">รถ 4 ล้อ (4W)</option>
                                <option value="2W">มอเตอร์ไซค์ (2W)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">รายละเอียด / พื้นที่ / วันที่เริ่มงาน *</label>
                            <input type="text" name="note" placeholder="เช่น สาทร / พร้อมเริ่ม 2026-08-31" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl transition shadow-md">
                        ยืนยันการสมัคร / ส่งข้อมูล
                    </button>
                </form>

                <div id="responseMessage" class="hidden mt-4 p-4 text-center rounded-xl text-sm font-medium"></div>
            </div>
        </section>
    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby9NvHS4uAPWKzF9WPgmcdtPKzkmUQbJZ9PzksBPmHgTMLJmJuO1ppEq68CqD6wwjXVYg/exec';

        const form = document.getElementById('driverForm');
        const submitBtn = document.getElementById('submitBtn');
        const responseMessage = document.getElementById('responseMessage');

        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังส่งข้อมูล...';

            const formData = new FormData(form);

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(response => {
                    responseMessage.textContent = 'บันทึกข้อมูลสำเร็จเรียบร้อยแล้ว!';
                    responseMessage.className = 'mt-4 p-4 text-center rounded-xl text-sm font-medium bg-green-100 text-green-700';
                    form.reset();
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'ยืนยันการสมัคร / ส่งข้อมูล';
                })
                .catch(error => {
                    responseMessage.textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
                    responseMessage.className = 'mt-4 p-4 text-center rounded-xl text-sm font-medium bg-red-100 text-red-700';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'ยืนยันการสมัคร / ส่งข้อมูล';
                });
        });
    </script>
</body>
</html>
